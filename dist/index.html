<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A message viewer for the Fulcra Mesh.">
  <title>Fulcra Mesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./"><span data-icon="network"></span>Fulcra <span>Mesh</span></a>
    </header>
    <main>
      <section class="participants-section" aria-labelledby="participants-heading">
        <h2 id="participants-heading">Participants <span id="participant-count"></span></h2>
        <ul id="participants" class="participants"></ul>
      </section>
      <div class="view-toolbar">
        <div class="view-tabs" role="tablist" aria-label="Message view">
          <button id="messages-tab" role="tab" aria-selected="true" aria-controls="messages-panel" tabindex="0"><span data-icon="message"></span>Messages</button>
          <button id="json-tab" role="tab" aria-selected="false" aria-controls="json-panel" tabindex="-1"><span data-icon="braces"></span>JSON</button>
        </div>
        <span id="message-count" class="message-count"></span>
      </div>
      <section id="messages-panel" role="tabpanel" aria-labelledby="messages-tab"><div id="timeline"></div></section>
      <section id="json-panel" role="tabpanel" aria-labelledby="json-tab" hidden><pre class="json-document"><code id="json-document"></code></pre></section>
    </main>
  </div>
</body>
</html>
